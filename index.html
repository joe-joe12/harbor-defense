<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>港口防線</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: wide harbor map on the left, command dock on the right; the dock drops below the map on phones.
   This game commits to one dark look (night harbor), so there is no light variant. */
:root{
  --bg:#0d1f26; --panel:#142c35; --panel-2:#1a3742; --line:#2a4b58;
  --fg:#e6f0f2; --muted:#8fb0ba;
  --amber:#f2b441; --coral:#e8744f; --ice:#7fd8f0; --lime:#b9e36a;
  --danger:#ff7b7b; --good:#6fdc9a;
  --font-body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --font-num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
html,body{touch-action:manipulation}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input{-webkit-user-select:text;user-select:text}
body{
  background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.5;
  padding-block:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.app{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--font-num);font-size:30px;letter-spacing:.12em;margin:0;font-weight:700;line-height:1.1}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 12px;display:flex;align-items:baseline;gap:8px}
.stat span{color:var(--muted);font-size:12px;letter-spacing:.12em}
.stat b{font-family:var(--font-num);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
#sLives{color:var(--danger)} #sGold{color:var(--amber)} #sWave{color:var(--ice)}
.main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;align-items:start}
.stagecol{display:flex;flex-direction:column;gap:8px;min-width:0}
.stage{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#10262d}
canvas{display:block;width:100%;height:auto;aspect-ratio:16/10;cursor:crosshair;touch-action:none;-webkit-tap-highlight-color:transparent}
.hint{margin:0;color:var(--muted);font-size:13px;min-height:20px}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,20,25,.82);padding:16px;overflow:auto}
.ocard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px 24px;max-width:360px;width:100%;display:flex;flex-direction:column;gap:10px;text-align:center;margin:auto}
.ocard h2{margin:0;font-size:26px;letter-spacing:.1em}
.ocard p{margin:0}
.dock{display:flex;flex-direction:column;gap:12px;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.panel h2{font-size:12px;letter-spacing:.16em;color:var(--muted);margin:0;font-weight:500;display:flex;justify-content:space-between;align-items:baseline}
.kbd{font-family:var(--font-num);font-size:13px;letter-spacing:.06em}
button{font:inherit;color:var(--fg);background:var(--panel-2);border:1px solid var(--line);border-radius:6px;min-height:44px;padding:8px 12px;cursor:pointer;transition:background .15s,border-color .15s}
button:hover:not(:disabled){background:#21444f;border-color:#3b6372}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
.primary{background:var(--amber);color:#1a1405;border-color:var(--amber);font-weight:700;font-size:16px;width:100%}
.primary:hover:not(:disabled){background:#ffc65a;border-color:#ffc65a}
input{font:inherit;color:var(--fg);background:#0f242c;border:1px solid var(--line);border-radius:6px;min-height:44px;padding:8px 12px;min-width:0;width:100%}
#codeIn{text-transform:uppercase;letter-spacing:.2em;text-align:center;font-family:var(--font-num);font-size:20px}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}
.row>.narrow{flex:0 0 96px}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:6px 8px;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--amber);color:#1a1405;border-color:var(--amber);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.shop{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tw{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border-left:4px solid var(--c);padding:8px 10px;min-height:76px}
.tw b{font-size:15px}
.tw small{color:var(--muted);font-size:12px;line-height:1.35}
.tw[aria-pressed="true"],.ab[aria-pressed="true"]{background:#264b58;border-color:var(--c,var(--amber))}
.tw.poor .coin{color:var(--danger)}
.abs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ab{display:flex;flex-direction:column;align-items:flex-start;gap:0;text-align:left;border-left:4px solid var(--c);padding:6px 10px;min-height:56px}
.ab small{color:var(--muted);font-size:12px}
.coin{font-family:var(--font-num);font-size:16px;font-weight:600;color:var(--amber);display:inline-flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.coin::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor;display:inline-block}
.sel-head{display:flex;align-items:center;gap:8px}
.sel-head .lv{margin-left:auto;font-family:var(--font-num);font-size:16px;color:var(--amber)}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:0}
.kv div{background:var(--panel-2);border-radius:6px;padding:4px 8px}
.kv dt{font-size:11px;color:var(--muted)}
.kv dd{margin:0;font-family:var(--font-num);font-size:18px;font-variant-numeric:tabular-nums}
.muted{color:var(--muted);margin:0;font-size:13px}
.plrow{display:flex;align-items:center;gap:8px;padding:2px 0}
.big{font-family:var(--font-num);font-size:44px;letter-spacing:.3em;color:var(--amber);line-height:1;padding-left:.3em}
@media (max-width:860px){
  .main{grid-template-columns:minmax(0,1fr)}
  h1{font-size:26px}
  #selPanel.active{order:-1;border-color:var(--amber)}
}
@media (prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <h1>港口防線</h1>
    <div class="stats">
      <div class="stat"><span>生命</span><b id="sLives">20</b></div>
      <div class="stat"><span>金幣</span><b id="sGold">180</b></div>
      <div class="stat"><span>波次</span><b id="sWave">0/20</b></div>
    </div>
  </header>

  <div class="main">
    <div class="stagecol">
      <section class="stage">
        <canvas id="cv" aria-label="塔防戰場"></canvas>

        <div class="overlay" id="menu">
          <div class="ocard">
            <h2>港口防線</h2>
            <p class="muted">守住燈塔，撐過 20 波敵艦。可以單人玩，也能和朋友連線合作。</p>
            <div class="seg" id="diffSeg" role="group" aria-label="難度">
              <button type="button" data-d="easy" aria-pressed="false">簡單</button>
              <button type="button" data-d="normal" aria-pressed="true">普通</button>
              <button type="button" data-d="hard" aria-pressed="false">困難</button>
            </div>
            <button class="primary" id="soloBtn" type="button">單人遊戲</button>
            <button id="metaBtn" type="button">抽塔・選塔　<span class="coin" id="coinTxt"></span></button>
            <button id="hostBtn" type="button">建立連線房間（需自行架站）</button>
            <div class="row">
              <input id="codeIn" maxlength="5" placeholder="房間代碼" autocomplete="off" aria-label="房間代碼">
              <button class="narrow" id="joinBtn" type="button">加入</button>
            </div>
            <p class="muted" id="menuMsg"></p>
          </div>
        </div>

        <div class="overlay" id="metaOv" hidden>
          <div class="ocard">
            <h2>抽塔・選塔</h2>
            <p class="muted">星幣：<span class="coin" id="mCoin"></span>　保底：<span id="mPity"></span>/10</p>
            <div class="row"><button id="pull1" type="button">單抽 100</button><button id="pull10" type="button">十連抽 900</button></div>
            <p class="muted" id="mRes">重複抽到會升星（每星 +5% 傷害，最高 5 星）。</p>
            <p class="muted">點選要帶入的砲塔（最多 4 座）</p>
            <div class="shop" id="mList"></div>
            <button class="primary" id="mBack" type="button">完成</button>
          </div>
        </div>

        <div class="overlay" id="lobby" hidden>
          <div class="ocard">
            <h2>房間已建立</h2>
            <p class="muted">把代碼或連結傳給朋友，最多 4 人一起守港。</p>
            <div class="big" id="lobbyCode">-----</div>
            <input id="lobbyLink" readonly aria-label="邀請連結">
            <button id="lobbyCopy" type="button">複製邀請連結</button>
            <div id="lobbyList" style="text-align:left"></div>
            <button class="primary" id="lobbyGo" type="button">開始布陣</button>
          </div>
        </div>

        <div class="overlay" id="overlay" hidden>
          <div class="ocard">
            <h2 id="oTitle"></h2>
            <p id="oText"></p>
            <p class="muted" id="oBest"></p>
            <button class="primary" id="contBtn" type="button">繼續挑戰無盡模式</button>
            <button class="primary" id="againBtn" type="button">再玩一次</button>
            <p class="muted" id="oWait" hidden>等待房主操作…</p>
          </div>
        </div>

        <div class="overlay" id="disc" hidden>
          <div class="ocard">
            <h2>與房主斷線</h2>
            <p class="muted">連線已中斷，可以回到主選單重新加入。</p>
            <button class="primary" id="reloadBtn" type="button">回到主選單</button>
          </div>
        </div>
      </section>
      <p class="hint" id="hint"></p>
    </div>

    <aside class="dock">
      <div class="panel">
        <h2>指揮 <span class="kbd">空白鍵 開始／暫停</span></h2>
        <button class="primary" id="startBtn" type="button">開始第 1 波</button>
        <div class="row">
          <button id="pauseBtn" type="button">暫停</button>
          <button id="speedBtn" type="button">速度 ×1</button>
          <button id="muteBtn" type="button">音效 開</button>
        </div>
        <div class="muted" id="previewLabel"></div>
        <div class="chips" id="preview"></div>
      </div>
      <div class="panel">
        <h2>技能 <span class="kbd">A 空襲　Z 凍結</span></h2>
        <div class="abs">
          <button class="ab" id="abAir" type="button" style="--c:#ff7b7b"><b>空襲</b><small id="abAirT">就緒</small></button>
          <button class="ab" id="abFreeze" type="button" style="--c:#7fd8f0"><b>凍結</b><small id="abFreezeT">就緒</small></button>
        </div>
      </div>
      <div class="panel">
        <h2>建造 <span class="kbd">快捷鍵 1–6</span></h2>
        <div class="shop" id="shop"></div>
      </div>
      <div class="panel" id="selPanel"></div>
      <div class="panel" id="plPanel" hidden>
        <h2>玩家 <span class="kbd" id="plCount"></span></h2>
        <div id="plList"></div>
        <input id="inviteIn" readonly aria-label="邀請連結">
        <button id="inviteBtn" type="button">複製邀請連結</button>
      </div>
    </aside>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(() => {
'use strict';
const W = 960, H = 600, C = 60, COLS = 16, ROWS = 10, MAX_WAVE = 20, MAX_PLAYERS = 4;
const KEY = 'harbor-defense-best', MUTE_KEY = 'harbor-defense-mute';
const $ = id => document.getElementById(id);
const canvas = $('cv'), ctx = canvas.getContext('2d');
const dpr = Math.min(2, window.devicePixelRatio || 1);
canvas.width = W * dpr; canvas.height = H * dpr;
const bg = document.createElement('canvas');
bg.width = W * dpr; bg.height = H * dpr;

/* ---------- 航道 ---------- */
const WP = [[-1,2],[11,2],[11,5],[3,5],[3,8],[16,8]];
const pts = WP.map(([c, r]) => ({ x: c * C + C / 2, y: r * C + C / 2 }));
const segs = []; let total = 0;
for (let i = 0; i < pts.length - 1; i++) {
  const a = pts[i], b = pts[i + 1], len = Math.hypot(b.x - a.x, b.y - a.y);
  segs.push({ a, b, len, start: total, ang: Math.atan2(b.y - a.y, b.x - a.x) });
  total += len;
}
function posAt(d) {
  for (const s of segs) {
    if (d <= s.start + s.len) {
      const t = Math.max(0, (d - s.start) / s.len);
      return { x: s.a.x + (s.b.x - s.a.x) * t, y: s.a.y + (s.b.y - s.a.y) * t, ang: s.ang };
    }
  }
  const s = segs[segs.length - 1];
  return { x: s.b.x, y: s.b.y, ang: s.ang };
}
const blocked = Array.from({ length: ROWS }, () => Array(COLS).fill(false));
for (let i = 0; i < WP.length - 1; i++) {
  let [c, r] = WP[i]; const [c2, r2] = WP[i + 1];
  const dc = Math.sign(c2 - c), dr = Math.sign(r2 - r);
  for (;;) {
    if (c >= 0 && c < COLS && r >= 0 && r < ROWS) blocked[r][c] = true;
    if (c === c2 && r === r2) break;
    c += dc; r += dr;
  }
}
blocked[7][15] = true; // 燈塔

/* ---------- 資料 ---------- */
const TOWERS = {
  gun:     { name: '機槍塔', cost: 60,  range: 130, rate: 0.28, dmg: 9,   color: '#f2b441', desc: '射速快，穩定輸出' },
  cannon:  { name: '加農砲', cost: 120, range: 150, rate: 1.4,  dmg: 36,  splash: 58, color: '#e8744f', desc: '爆炸範圍傷害，剋制群體' },
  frost:   { name: '冰霜塔', cost: 90,  range: 115, rate: 1.1,  dmg: 5,   slow: 0.45, color: '#7fd8f0', desc: '範圍減速並造成輕傷' },
  sniper:  { name: '狙擊塔', cost: 160, range: 270, rate: 2.2,  dmg: 90, color: '#b9e36a', desc: '超遠射程，單發重傷' },
  arc:     { name: '電弧塔', cost: 140, range: 140, rate: 1.0,  dmg: 28,  chain: 2, color: '#c79bff', desc: '閃電連鎖，同時打多艘' },
  support: { name: '增幅塔', cost: 110, range: 110, rate: 99,   dmg: 0,   color: '#5eead4', desc: '提升範圍內砲塔的傷害' }
};
const TK = Object.keys(TOWERS);
const RAR = { gun: 0, cannon: 0, frost: 0, arc: 1, support: 1, sniper: 2 }, RN = ['普通', '稀有', '史詩'], META_KEY = 'harbor-meta';
let meta = { coin: 300, owned: { gun: 1, cannon: 1, frost: 1 }, loadout: ['gun', 'cannon', 'frost'], pity: 0 };
try { const m = JSON.parse(localStorage.getItem(META_KEY)); if (m && m.owned) meta = m; } catch (e) {}
const saveMeta = () => { try { localStorage.setItem(META_KEY, JSON.stringify(meta)); } catch (e) {} };
let LK = meta.loadout.filter(k => meta.owned[k]);
if (!LK.length) LK = ['gun'];
const starMul = k => 1 + 0.05 * ((meta.owned[k] || 1) - 1);
const SUP = [0.15, 0.24, 0.34];
const ENEMIES = {
  swift:    { name: '小艇',   hp: 38,   speed: 78, reward: 5,   size: 8,  armor: 0, dmg: 1, color: '#ff9a8a' },
  patrol:   { name: '巡邏艦', hp: 105,  speed: 52, reward: 9,   size: 11, armor: 0, dmg: 1, color: '#e0525e' },
  armor:    { name: '裝甲艦', hp: 360,  speed: 34, reward: 20,  size: 14, armor: 3, dmg: 2, color: '#9a6bb5' },
  healer:   { name: '補給艦', hp: 150,  speed: 46, reward: 14,  size: 12, armor: 0, dmg: 1, color: '#5fd0a0' },
  splitter: { name: '母艦',   hp: 320,  speed: 38, reward: 18,  size: 15, armor: 1, dmg: 2, color: '#d08a3c' },
  boss:     { name: '旗艦',   hp: 2600, speed: 26, reward: 160, size: 20, armor: 5, dmg: 6, color: '#c93b4a' }
};
const EK = Object.keys(ENEMIES);
const DIFF = { easy: { hp: 0.75, gold: 240, lives: 25 }, normal: { hp: 1, gold: 180, lives: 20 }, hard: { hp: 1.35, gold: 150, lives: 12 } };
const AB = { air: { cd: 40 }, freeze: { cd: 75 } };
const MODES = { first: '最前方', strong: '最強', close: '最近' };
const MODE_ORDER = ['first', 'strong', 'close'];
const PH = ['idle', 'running', 'over'];
const PCOL = ['#f2b441', '#7fd8f0', '#ff8fb1', '#b9e36a'];

let state, towers, enemies, projs, fx, parts, floats, queue, spawnT, strikes;
let armed = null, armedAb = null, selected = null, hover = null, pending = null, kills = 0, best = 0, time = 0, tid = 0, eid = 0;
let role = 'solo', peer = null, hostConn = null, players = [], myId = 0, outbox = [], menuOpen = true;
let emap = new Map(), roomCode = '', diffPick = 'normal', muted = false;
try { best = +localStorage.getItem(KEY) || 0; muted = localStorage.getItem(MUTE_KEY) === '1'; } catch (e) {}

function buffAt(t) {
  let b = 0;
  for (const s of towers) {
    if (s.type !== 'support' || s === t) continue;
    const r = TOWERS.support.range * (1 + 0.08 * (s.lvl - 1));
    if (Math.hypot(s.x - t.x, s.y - t.y) <= r) b += SUP[s.lvl - 1];
  }
  return Math.min(0.6, b);
}
function stats(t) {
  const d = TOWERS[t.type], l = t.lvl;
  return {
    range: d.range * (1 + 0.08 * (l - 1)),
    rate: d.rate * Math.pow(0.92, l - 1),
    dmg: d.dmg * [1, 1.5, 2.1][l - 1] * starMul(t.type) * (t.type === 'support' ? 1 : 1 + buffAt(t)),
    splash: d.splash ? d.splash * (1 + 0.1 * (l - 1)) : 0,
    slow: d.slow ? Math.min(0.7, d.slow + 0.1 * (l - 1)) : 0,
    chain: d.chain ? d.chain + l - 1 : 0,
    buff: t.type === 'support' ? SUP[l - 1] : 0
  };
}
const upCost = t => t.lvl >= 3 ? null : Math.round(TOWERS[t.type].cost * (t.lvl === 1 ? 0.8 : 1.2));
const sellValue = t => Math.round(t.spent * 0.7);
const hpMult = n => 1 + 0.2 * (n - 1) + 0.012 * (n - 1) * (n - 1);

function waveGroups(n) {
  const g = [];
  g.push({ t: 'swift', c: n <= 12 ? 6 + n * 2 : 8, gap: Math.max(0.28, 0.7 - n * 0.02) });
  if (n >= 3) g.push({ t: 'patrol', c: Math.min(60, 2 + Math.floor((n - 2) * 1.3)), gap: Math.max(0.4, 1.1 - n * 0.03) });
  if (n >= 6) g.push({ t: 'armor', c: Math.min(45, Math.floor((n - 4) * 0.9)), gap: Math.max(0.6, 1.6 - n * 0.03) });
  if (n >= 8) g.push({ t: 'healer', c: Math.min(14, Math.floor((n - 5) / 3)), gap: 1.4 });
  if (n >= 12) g.push({ t: 'splitter', c: Math.min(16, Math.floor((n - 9) / 3)), gap: 1.8 });
  if (n % 10 === 0) g.push({ t: 'boss', c: Math.min(6, n / 10), gap: 3 });
  return g;
}
function buildQueue(n) {
  const items = [];
  for (const g of waveGroups(n)) {
    for (let i = 0; i < g.c; i++) {
      items.push({ t: g.t, gap: g.gap, k: g.t === 'boss' ? 2 + i : (i + 0.5) / g.c + (Math.random() - 0.5) * 0.04 });
    }
  }
  items.sort((a, b) => a.k - b.k);
  return items;
}

/* ---------- 音效 ---------- */
let AC = null; const lastS = {};
function ensureAC() {
  if (!AC) { const A = window.AudioContext || window.webkitAudioContext; if (A) { try { AC = new A(); } catch (e) {} } }
  if (AC && AC.state === 'suspended') { try { AC.resume(); } catch (e) {} }

function tone(f1, f2, dur, type, vol) {

  if (leaked) { emit({ e: 'sfx', s: 'leak' }); updateStats(); }

  for (const h of enemies) {
    if (h.type !== 'healer' || !h.alive) continue;
    for (const e of enemies) {
      if (e === h || !e.alive || e.hp >= e.max) continue;
      if ((e.x - h.x) * (e.x - h.x) + (e.y - h.y) * (e.y - h.y) < 10000) e.hp = Math.min(e.max, e.hp + e.max * 0.06 * dt);
    }
  }
  for (const s of strikes) {
    s.t -= dt;
    if (s.t > 0) continue;
    s.done = true;
    emit({ e: 'ring', x: Math.round(s.x), y: Math.round(s.y), max: 54, life: 0.35, color: '#ff7b7b', s: 'air' });
    emit({ e: 'burst', x: s.x, y: s.y, color: '#ffb36b', n: 12, sp: 120 });
    for (const e of enemies.slice()) if (e.alive && Math.hypot(e.x - s.x, e.y - s.y) <= 54 + e.def.size * 0.5) damage(e, s.dmg);
  }
  strikes = strikes.filter(s => !s.done);
  for (const t of towers) {
    if (t.type === 'support') continue;
    t.cd -= dt;
    if (t.cd > 0) continue;
    const s = stats(t), tgt = pickTarget(t, s.range);
    if (!tgt) continue;
    fire(t, s, tgt);
    t.cd = s.rate;
  }
  updateVisuals(dt);
  enemies = enemies.filter(e => e.alive);
  if (state.phase === 'running' && !queue.length && !enemies.length) waveCleared();
}

/* 玩家端：用房主的快照推進畫面，敵艦位置以前進速度外插 */
function updateGuest(dt) {
  for (const e of enemies) {
    if (!e.alive) continue;
    e.dist = Math.min(total, e.dist + e.def.speed * (e.slowT > 0 ? 1 - e.slow : 1) * dt);
    if (e.slowT > 0) e.slowT -= dt;
    const p = posAt(e.dist); e.x = p.x; e.y = p.y; e.ang = p.ang;
  }
  updateVisuals(dt);
}

/* ---------- 繪製 ---------- */
function drawTower(t, ghost) {
  const d = TOWERS[t.type];
  ctx.save(); ctx.translate(t.x, t.y);
  if (ghost) ctx.globalAlpha = 0.65;
  ctx.fillStyle = '#10262d'; ctx.strokeStyle = t.lvl === 3 ? '#f2b441' : d.color; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 0, 22, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = d.color;
  for (let i = 0; i < t.lvl; i++) { ctx.beginPath(); ctx.arc((i - (t.lvl - 1) / 2) * 7, 15, 2, 0, 7); ctx.fill(); }
  if (role !== 'solo' && !ghost && t.owner != null) {
    const pc = players.find(p => p.id === t.owner);
    if (pc) { ctx.fillStyle = pc.color; ctx.beginPath(); ctx.arc(15, -15, 3.5, 0, 7); ctx.fill(); }
  }
  const rc = t.recoil || 0;
  if (t.type === 'frost') {
    ctx.rotate(time * 0.6);
    ctx.fillStyle = d.color; ctx.strokeStyle = '#e9fbff'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; ctx.lineTo(Math.cos(a) * 13, Math.sin(a) * 13); }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath();
    for (let i = 0; i < 3; i++) { const a = i * Math.PI / 3; ctx.moveTo(Math.cos(a) * 13, Math.sin(a) * 13); ctx.lineTo(-Math.cos(a) * 13, -Math.sin(a) * 13); }
    ctx.stroke();
  } else if (t.type === 'support') {
    ctx.rotate(Math.PI / 4);
    ctx.fillStyle = d.color; ctx.fillRect(-9, -9, 18, 18);
    ctx.fillStyle = '#10262d'; ctx.fillRect(-4, -4, 8, 8);
    ctx.rotate(-Math.PI / 4);
    ctx.strokeStyle = d.color; ctx.globalAlpha = (ghost ? 0.65 : 1) * (0.35 + 0.25 * Math.sin(time * 3)); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0, 0, 17, 0, 7); ctx.stroke();
  } else if (t.type === 'arc') {
    ctx.fillStyle = '#2b2140'; ctx.beginPath(); ctx.arc(0, 0, 12, 0, 7); ctx.fill();
    ctx.strokeStyle = d.color; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(0, 0, 12, 0, 7); ctx.stroke();
    ctx.rotate(t.ang || 0);
    ctx.beginPath(); ctx.moveTo(4, 0); ctx.lineTo(14, -5); ctx.moveTo(4, 0); ctx.lineTo(16, 0); ctx.moveTo(4, 0); ctx.lineTo(14, 5); ctx.stroke();
    ctx.fillStyle = d.color; ctx.beginPath(); ctx.arc(0, 0, 5, 0, 7); ctx.fill();
  } else {
    ctx.rotate(t.ang || 0);
    if (t.type === 'gun') {
      ctx.fillStyle = '#cfd8dc'; ctx.fillRect(2 - rc, -3, 22, 6);
      ctx.fillStyle = d.color; ctx.beginPath(); ctx.arc(0, 0, 10, 0, 7); ctx.fill();
    } else if (t.type === 'cannon') {
      ctx.fillStyle = '#7a4a3a'; ctx.fillRect(0 - rc, -5.5, 21, 11);
      ctx.fillStyle = d.color; ctx.beginPath(); ctx.arc(0, 0, 12, 0, 7); ctx.fill();
      ctx.fillStyle = '#10262d'; ctx.beginPath(); ctx.arc(0, 0, 5, 0, 7); ctx.fill();
    } else {
      ctx.fillStyle = '#dfe8cf'; ctx.fillRect(2 - rc, -2, 31, 4);
      ctx.fillStyle = d.color; ctx.beginPath(); ctx.arc(0, 0, 9, 0, 7); ctx.fill();
      ctx.fillStyle = '#10262d'; ctx.fillRect(6, -6, 9, 3);
    }
  }
  ctx.restore();
}
function rangeCircle(x, y, r, color, dashed) {
  ctx.save();
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7);
  ctx.fillStyle = 'rgba(255,255,255,.05)'; ctx.fill();
  ctx.strokeStyle = color; ctx.globalAlpha = 0.8; ctx.lineWidth = 1.5;
  if (dashed) ctx.setLineDash([6, 5]);
  ctx.stroke(); ctx.restore();
}
function drawEnemy(e) {
  const s = e.def.size;
  ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(e.ang);
  ctx.fillStyle = e.def.color; ctx.strokeStyle = e.type === 'boss' ? '#f2b441' : 'rgba(0,0,0,.45)'; ctx.lineWidth = e.type === 'boss' ? 2 : 1.5;
  ctx.beginPath();
  ctx.moveTo(s * 1.3, 0); ctx.lineTo(s * 0.5, s * 0.8); ctx.lineTo(-s, s * 0.8); ctx.lineTo(-s * 1.1, 0); ctx.lineTo(-s, -s * 0.8); ctx.lineTo(s * 0.5, -s * 0.8);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(-s * 0.4, -s * 0.35, s * 0.8, s * 0.7);
  if (e.type === 'healer') {
    ctx.fillStyle = '#eafff5'; ctx.fillRect(-s * 0.5, -s * 0.12, s, s * 0.24); ctx.fillRect(-s * 0.12, -s * 0.5, s * 0.24, s);
  } else if (e.type === 'splitter') {
    ctx.fillStyle = '#2a1a0a'; ctx.beginPath(); ctx.arc(-s * 0.2, -s * 0.28, s * 0.2, 0, 7); ctx.arc(-s * 0.2, s * 0.28, s * 0.2, 0, 7); ctx.fill();

  ctx.restore();

    const w = s * 2.6, x = e.x - w / 2, y = e.y - s - 9;

    ctx.fillStyle = e.hp / e.max > 0.5 ? '#6fdc9a' : e.hp / e.max > 0.25 ? '#f2b441' : '#ff7b7b';

  }
}
function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.drawImage(bg, 0, 0, W, H);
  ctx.save();
  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));

  ctx.strokeStyle = 'rgba(255,255,255,.14)'; ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
  ctx.restore();
  const aim = pending || hover;
  if (armed && aim && aim.c >= 0 && aim.c < COLS && aim.r >= 0 && aim.r < ROWS) {
    const ok = canPlace(aim.c, aim.r), afford = state.gold >= TOWERS[armed].cost;
    ctx.fillStyle = ok && afford ? 'rgba(111,220,154,.28)' : 'rgba(255,123,123,.3)';
    ctx.fillRect(aim.c * C, aim.r * C, C, C);
    if (pending) { ctx.save(); ctx.strokeStyle = '#e6f0f2'; ctx.lineWidth = 2; ctx.setLineDash([5, 4]); ctx.strokeRect(aim.c * C + 2, aim.r * C + 2, C - 4, C - 4); ctx.restore(); }
    if (ok) {
      const gt = { type: armed, x: aim.c * C + C / 2, y: aim.r * C + C / 2, lvl: 1, ang: -Math.PI / 2, recoil: 0 };
      rangeCircle(gt.x, gt.y, TOWERS[armed].range, TOWERS[armed].color, true);
      drawTower(gt, true);
    }
  }
  if (armedAb === 'air' && hover) rangeCircle(hover.x, hover.y, 90, '#ff7b7b', true);
  if (selected) {
    rangeCircle(selected.x, selected.y, stats(selected).range, '#e6f0f2', true);
    ctx.save(); ctx.strokeStyle = '#e6f0f2'; ctx.lineWidth = 2; ctx.setLineDash([4, 4]);
    ctx.strokeRect(selected.c * C + 3, selected.r * C + 3, C - 6, C - 6); ctx.restore();
  }
  for (const t of towers) drawTower(t, false);
  for (const e of enemies) drawEnemy(e);
  for (const p of projs) {
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.ang || 0);
    ctx.fillStyle = p.color;
    if (p.kind === 'bullet') ctx.fillRect(-5, -1.5, 10, 3);
    else { ctx.beginPath(); ctx.arc(0, 0, 5, 0, 7); ctx.fill(); }
    ctx.restore();
  }
  for (const f of fx) {
    const pr = 1 - f.t / f.life;
    ctx.save();
    if (f.k === 'ring') {
      ctx.globalAlpha = 1 - pr; ctx.strokeStyle = f.color; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.max * Math.min(1, pr * 1.2), 0, 7); ctx.stroke();
    } else if (f.k === 'warn') {
      ctx.globalAlpha = 0.5 + 0.4 * Math.sin(pr * 25); ctx.strokeStyle = f.color; ctx.fillStyle = 'rgba(255,80,80,.12)'; ctx.lineWidth = 2; ctx.setLineDash([6, 5]);
      ctx.beginPath(); ctx.arc(f.x, f.y, f.max, 0, 7); ctx.fill(); ctx.stroke();
    } else {
      ctx.globalAlpha = 1 - pr; ctx.strokeStyle = f.color; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(f.x1, f.y1); ctx.lineTo(f.x2, f.y2); ctx.stroke();
    }
    ctx.restore();
  }
  for (const p of parts) {
    ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center';
  for (const f of floats) {
    ctx.globalAlpha = Math.min(1, f.life / (f.max * 0.5));
    ctx.fillStyle = f.color;
    ctx.font = f.big ? '700 26px "Noto Sans TC",sans-serif' : '700 15px "Barlow Condensed",sans-serif';
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1; ctx.textAlign = 'start';
  if (role !== 'solo') {
    for (const p of players) {
      if (p.id === myId || !(p.x >= 0)) continue;
      ctx.save(); ctx.translate(p.x, p.y);
      ctx.fillStyle = p.color; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(11, 5); ctx.lineTo(5, 11); ctx.closePath(); ctx.fill();
      ctx.font = '600 12px "Noto Sans TC",sans-serif'; ctx.fillText(p.name, 13, 20);
      ctx.restore();
    }
  }
  if (state.flash > 0) {
    const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.85);
    g.addColorStop(0, 'rgba(255,80,80,0)'); g.addColorStop(1, `rgba(255,80,80,${state.flash * 0.45})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  if (state.paused && state.phase !== 'over') {
    ctx.fillStyle = 'rgba(8,20,25,.6)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#e6f0f2'; ctx.textAlign = 'center'; ctx.font = '700 40px "Noto Sans TC",sans-serif';
    ctx.fillText('已暫停', W / 2, H / 2 + 12); ctx.textAlign = 'start';
  }
}

    players = [{ id: 0, name: '玩家1', color: PCOL[0], x: -100, y: -100 }];
    reset(diffPick);
    menuOpen = true; plSig = '';
    $('menu').hidden = true; $('lobby').hidden = false;
    refreshAll();
  });
  peer.on('connection', onGuestConnection);
  peer.on('error', err => {
    if (!done) {
      clearTimeout(tmo); cleanupPeer();
      if (err.type === 'unavailable-id' && (tries || 0) < 3) { startHost((tries || 0) + 1); return; }
      menuMsg('建立房間失敗：' + err.type);
    } else setHint('連線錯誤：' + err.type);
  });
}
function nextPid() { for (let i = 1; i < MAX_PLAYERS; i++) if (!players.some(p => p.id === i)) return i; return -1; }
function onGuestConnection(conn) {
  conn.on('open', () => {
    const id = nextPid();
    if (id < 0) { conn.send({ t: 'full' }); setTimeout(() => { try { conn.close(); } catch (e) {} }, 300); return; }
    const p = { id, name: '玩家' + (id + 1), color: PCOL[id], x: -100, y: -100, conn };
    players.push(p);
    conn.send({ t: 'welcome', id, diff: state.diff });
    updatePlayersUI();
    setHint(`${p.name} 加入了房間。`);
  });
  conn.on('data', m => {
    const p = players.find(q => q.conn === conn); if (!p || !m) return;
    if (m.t === 'cmd' && m.c) {
      const r = execCmd(m.c, p.id);
      if (r && r.ok === false && r.msg) conn.send({ t: 'msg', text: r.msg });
      refreshAll();
    } else if (m.t === 'cur') { p.x = +m.x; p.y = +m.y; }
  });
  conn.on('close', () => {
    const p = players.find(q => q.conn === conn);
    players = players.filter(q => q.conn !== conn);
    if (p) setHint(`${p.name} 離開了房間。`);
    updatePlayersUI();
  });
}
function joinRoom(code) {
  code = String(code || '').trim().toUpperCase();
  if (!/^[A-Z0-9]{5}$/.test(code)) { menuMsg('請輸入 5 碼房間代碼。'); return; }
  if (typeof Peer === 'undefined') { menuMsg('連線元件沒有載入，請確認網路後重新整理頁面。'); return; }
  menuMsg('連線中…');
  let ok = false, tmo = 0;
  try { peer = new Peer(); } catch (e) { menuMsg('這個環境不支援連線功能。'); return; }
  tmo = setTimeout(() => { if (!ok) { menuMsg('連線逾時。請確認代碼，且房主與你都在自己的網站（如 GitHub Pages）上開啟遊戲。'); cleanupPeer(); } }, 15000);
  peer.on('open', () => {
    const c = peer.connect('harbor-' + code, { reliable: true, serialization: 'json' });
    hostConn = c;
    c.on('data', m => {
      if (!m) return;
      if (m.t === 'welcome') {
        ok = true; clearTimeout(tmo);
        role = 'guest'; myId = m.id; roomCode = code; plSig = '';
        reset(m.diff); menuOpen = false;
        $('menu').hidden = true;
        refreshAll();
        setHint('已加入房間，和房主一起守住港口。');
      } else if (m.t === 'full') { clearTimeout(tmo); menuMsg('房間已滿（最多 4 人）。'); cleanupPeer(); }
      else if (m.t === 's' && role === 'guest') applySnapshot(m);
      else if (m.t === 'msg') setHint(m.text);
    });
    c.on('close', () => { if (role === 'guest') $('disc').hidden = false; });
    c.on('error', () => { if (!ok) menuMsg('連線失敗，請稍後再試。'); });
  });
  peer.on('error', err => {
    if (!ok) { clearTimeout(tmo); menuMsg(err.type === 'peer-unavailable' ? '找不到這個房間，請確認代碼。' : '連線失敗：' + err.type); cleanupPeer(); }
  });
}

function buildSnapshot() {
  const ev = outbox.length > 240 ? outbox.slice(-240) : outbox;
  outbox = [];
  return {
    t: 's',
    g: [state.gold, state.lives, state.wave, PH.indexOf(state.phase), state.speed, state.paused ? 1 : 0, kills, state.endless ? 1 : 0, state.win ? 1 : 0],
    cd: [+state.cd.air.toFixed(1), +state.cd.freeze.toFixed(1)],
    T: towers.map(t => [t.id, TK.indexOf(t.type), t.c, t.r, t.lvl, MODE_ORDER.indexOf(t.mode), Math.round(t.ang * 100), t.owner, t.spent]),
    E: enemies.map(e => [e.id, EK.indexOf(e.type), Math.round(e.dist), Math.round(e.hp), e.max, e.slowT > 0 ? Math.round(e.slow * 100) : 0]),
    P: players.map(p => [p.id, p.name, p.color, Math.round(p.x), Math.round(p.y)]),
    ev
  };
}
function broadcast() {
  if (role !== 'host') return;
  const targets = players.filter(p => p.conn && p.conn.open);
  if (!targets.length) { outbox = []; return; }
  const snap = buildSnapshot();
  for (const p of targets) { try { p.conn.send(snap); } catch (e) {} }
}
let selKey = '', preKey = '';
function applySnapshot(m) {
  const g = m.g, prevPhase = state.phase, prevLives = state.lives;
  state.gold = g[0]; state.lives = g[1]; state.wave = g[2]; state.phase = PH[g[3]] || 'idle';
  state.speed = g[4]; state.paused = !!g[5]; kills = g[6]; state.endless = !!g[7]; state.win = !!g[8];
  state.cd.air = m.cd[0]; state.cd.freeze = m.cd[1];
  if (state.lives < prevLives) state.flash = 1;
  towers = m.T.map(a => {
    const old = towers.find(t => t.id === a[0]);
    return { id: a[0], type: TK[a[1]], c: a[2], r: a[3], x: a[2] * C + C / 2, y: a[3] * C + C / 2, lvl: a[4], mode: MODE_ORDER[a[5]], ang: a[6] / 100, owner: a[7], spent: a[8], recoil: old ? old.recoil : 0 };
  });
  const seen = new Set();
  for (const a of m.E) {
    let e = emap.get(a[0]);
    if (!e) {
      const def = ENEMIES[EK[a[1]]];
      e = { id: a[0], type: EK[a[1]], def, hp: a[3], max: a[4], dist: a[2], x: 0, y: 0, ang: 0, slow: 0, slowT: 0, alive: true };
      emap.set(a[0], e); enemies.push(e);
    }
    e.dist = a[2]; e.hp = a[3]; e.max = a[4]; e.slow = a[5] / 100; e.slowT = a[5] ? 0.4 : 0;
    const p = posAt(e.dist); e.x = p.x; e.y = p.y; e.ang = p.ang;
    seen.add(a[0]);
  }
  enemies = enemies.filter(e => { if (seen.has(e.id)) return true; e.alive = false; emap.delete(e.id); return false; });
  players = m.P.map(a => ({ id: a[0], name: a[1], color: a[2], x: a[3], y: a[4] }));
  for (const ev of m.ev || []) applyEvent(ev);
  if (selected) selected = towers.find(t => t.id === selected.id) || null;
  if (state.phase === 'over' && prevPhase !== 'over') showOver();
  else if (state.phase !== 'over' && prevPhase === 'over') $('overlay').hidden = true;
  const sk = selected ? [selected.id, selected.lvl, selected.mode, selected.spent].join() : '-';
  const pk = state.wave + state.phase + state.endless;
  updateStats();
  if (pk !== preKey) { preKey = pk; renderPreview(); }
  if (sk !== selKey || (!selected && selKey !== '-')) { selKey = sk; renderSel(); }
  updatePlayersUI();
}

/* ---------- 輸入 ---------- */
function pointer(ev) {
  const r = canvas.getBoundingClientRect();
  const x = (ev.clientX - r.left) * W / r.width, y = (ev.clientY - r.top) * H / r.height;
  return { x, y, c: Math.floor(x / C), r: Math.floor(y / C) };
}
let curAt = 0;
canvas.addEventListener('pointermove', ev => {
  hover = pointer(ev);
  if (ev.pointerType !== 'mouse' && armed && pending && ev.buttons) pending = { c: hover.c, r: hover.r };
  if (role === 'solo') return;
  if (role === 'host') { const me = players.find(p => p.id === 0); if (me) { me.x = hover.x; me.y = hover.y; } }
  else if (hostConn && hostConn.open && performance.now() - curAt > 100) { curAt = performance.now(); hostConn.send({ t: 'cur', x: Math.round(hover.x), y: Math.round(hover.y) }); }
});
canvas.addEventListener('pointerleave', () => {
  hover = null;
  if (role === 'host') { const me = players.find(p => p.id === 0); if (me) me.x = -100; }
});
canvas.addEventListener('pointerup', ev => { if (ev.pointerType !== 'mouse') hover = null; });
canvas.addEventListener('contextmenu', ev => { ev.preventDefault(); disarm(); });
canvas.addEventListener('pointerdown', ev => {
  if (ev.button === 2) return;
  ensureAC();
  const p = pointer(ev); hover = p;
  if (state.phase === 'over' || menuOpen && role !== 'guest') return;
  if (armedAb === 'air') { armedAb = null; sendCmd({ k: 'air', x: Math.round(p.x), y: Math.round(p.y) }); return; }
  const t = towerAt(p.c, p.r);
  if (t) { selected = t; armed = null; pending = null; selKey = ''; setHint(`${TOWERS[t.type].name}　Lv ${t.lvl}。可在下方面板升級、出售或切換目標。`); refreshAll();
    try { if (window.matchMedia && window.matchMedia('(max-width:860px)').matches) $('selPanel').scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (e) {}
    return; }
  if (armed) {
    if (ev.pointerType !== 'mouse') {
      try { canvas.setPointerCapture(ev.pointerId); } catch (e) {}
      if (!(pending && pending.c === p.c && pending.r === p.r)) {
        pending = { c: p.c, r: p.r };
        setHint(canPlace(p.c, p.r) ? '可拖曳微調位置，再點一次同一格確認建造。' : '這格不能建造，請換一格。');
        return;
      }
      pending = null;
    }
    const d = TOWERS[armed];
    if (!canPlace(p.c, p.r)) { setHint('這格不能建造：航道、燈塔或已有砲塔。'); return; }
    if (state.gold < d.cost) { setHint(`金幣不足，${d.name}需要 ${d.cost}。`); return; }
    sendCmd({ k: 'place', type: armed, c: p.c, r: p.r });
  } else if (selected) { selected = null; selKey = ''; refreshAll(); }
});
function togglePause() {
  if (role === 'guest' || state.phase === 'over') return;
  state.paused = !state.paused;
  updateStats();
}
function cycleSpeed() {
  if (role === 'guest') return;
  state.speed = state.speed % 3 + 1;
  updateStats();
}
function abilityClick(name) {
  ensureAC();
  if (state.phase === 'over') return;
  if (name === 'freeze') sendCmd({ k: 'freeze' });
  else { armedAb = armedAb === 'air' ? null : 'air'; armed = null; selected = null; if (armedAb) setHint('點擊地圖選擇空襲目標，Esc 取消。'); refreshAll(); }
}
$('startBtn').addEventListener('click', () => { ensureAC(); sendCmd({ k: 'start' }); });
$('pauseBtn').addEventListener('click', togglePause);
$('speedBtn').addEventListener('click', cycleSpeed);
$('muteBtn').addEventListener('click', () => {
  muted = !muted; try { localStorage.setItem(MUTE_KEY, muted ? '1' : '0'); } catch (e) {}
  ensureAC(); updateStats();
});
$('abAir').addEventListener('click', () => abilityClick('air'));
$('abFreeze').addEventListener('click', () => abilityClick('freeze'));
$('againBtn').addEventListener('click', () => {
  if (role === 'guest') return;
  reset(); refreshAll();
});
$('contBtn').addEventListener('click', () => {
  if (role === 'guest') return;
  state.endless = true; state.phase = 'idle'; state.win = false;
  $('overlay').hidden = true;
  setHint('無盡模式開始，敵艦會越來越強。');
  refreshAll();
});
$('reloadBtn').addEventListener('click', () => location.reload());
$('inviteBtn').addEventListener('click', () => copyText($('inviteIn').value, $('inviteIn')));
$('lobbyCopy').addEventListener('click', () => copyText($('lobbyLink').value, $('lobbyLink')));
$('lobbyGo').addEventListener('click', () => { $('lobby').hidden = true; menuOpen = false; ensureAC(); setHint('房間已開放，按「開始」就能發動第一波。'); });
$('soloBtn').addEventListener('click', () => { ensureAC(); role = 'solo'; myId = 0; players = []; reset(diffPick); menuOpen = false; $('menu').hidden = true; refreshAll(); });
$('hostBtn').addEventListener('click', () => { ensureAC(); startHost(0); });
$('joinBtn').addEventListener('click', () => { ensureAC(); joinRoom($('codeIn').value); });
$('codeIn').addEventListener('keydown', ev => { if (ev.key === 'Enter') { ensureAC(); joinRoom($('codeIn').value); } });
$('diffSeg').addEventListener('click', ev => {
  const b = ev.target.closest && ev.target.closest('button'); if (!b) return;
  diffPick = b.dataset.d;
  for (const x of $('diffSeg').querySelectorAll('button')) x.setAttribute('aria-pressed', x === b ? 'true' : 'false');
});
document.addEventListener('keydown', ev => {
  if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if (ev.target && ev.target.tagName === 'INPUT') return;
  const k = ev.key;
  if (k >= '1' && k <= '6') { if (LK[+k - 1]) arm(LK[+k - 1]); return; }
  if (k === 'Escape') { armed = null; armedAb = null; pending = null; selected = null; selKey = ''; refreshAll(); return; }
  if (k === ' ') {
    if (ev.target.closest && ev.target.closest('button')) return;
    ev.preventDefault();
    if (menuOpen && role !== 'guest') return;
    if (state.phase === 'idle') sendCmd({ k: 'start' }); else togglePause();
    return;
  }
  if (k === 'u' || k === 'U') upgradeSel();
  else if (k === 's' || k === 'S') sellSel();
  else if (k === 'p' || k === 'P') togglePause();
  else if (k === 'f' || k === 'F') cycleSpeed();
  else if (k === 'a' || k === 'A') abilityClick('air');
  else if (k === 'z' || k === 'Z') abilityClick('freeze');
  else if (k === 'm' || k === 'M') $('muteBtn').click();
});

/* ---------- 主迴圈 ---------- */
let last = performance.now(), netAcc = 0, abAcc = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  time += dt;
  if (role === 'guest') updateGuest(dt);
  else if (!menuOpen && !state.paused && state.phase !== 'over') {
    for (let i = 0; i < state.speed; i++) { update(dt); if (state.phase === 'over') break; }
  } else updateVisuals(dt);
  if (role === 'host') { netAcc += dt; if (netAcc >= 1 / 12) { netAcc = 0; broadcast(); } }
  abAcc += dt; if (abAcc > 0.25) { abAcc = 0; updateAbilityUI(); }
  render();
  requestAnimationFrame(frame);
}
function pullOne() {
  meta.pity++;
  let r = Math.random() * 100; r = r < 60 ? 0 : r < 90 ? 1 : 2;
  if (meta.pity >= 10 && r === 0) r = 1;
  if (r > 0) meta.pity = 0;
  const pool = TK.filter(k => RAR[k] === r), k = pool[Math.floor(Math.random() * pool.length)], o = meta.owned[k], n = TOWERS[k].name;
  if (!o) { meta.owned[k] = 1; return `${n}（新）`; }
  if (o < 5) { meta.owned[k] = o + 1; return `${n} ★${o + 1}`; }
  meta.coin += 30; return `${n}（滿星，+30）`;
}
function pull(n) {
  const cost = n === 10 ? 900 : 100;
  if (meta.coin < cost) { $('mRes').textContent = '星幣不足，打贏一局可以獲得更多。'; return; }
  meta.coin -= cost; const out = [];
  for (let i = 0; i < n; i++) out.push(pullOne());
  saveMeta(); $('mRes').textContent = '獲得：' + out.join('、'); renderMeta();
}
function renderMeta() {
  $('coinTxt').textContent = meta.coin; $('mCoin').textContent = meta.coin; $('mPity').textContent = meta.pity;
  $('mList').innerHTML = '';
  TK.forEach(k => {
    const d = TOWERS[k], o = meta.owned[k], b = document.createElement('button');
    b.type = 'button'; b.className = 'tw'; b.style.setProperty('--c', d.color); b.disabled = !o;
    b.setAttribute('aria-pressed', meta.loadout.includes(k) ? 'true' : 'false');
    b.innerHTML = `<b>${d.name}</b><small>${RN[RAR[k]]}　${o ? '★'.repeat(o) : '未擁有'}</small>`;
    b.addEventListener('click', () => {
      const i = meta.loadout.indexOf(k);
      if (i >= 0) { if (meta.loadout.length > 1) meta.loadout.splice(i, 1); }
      else if (meta.loadout.length < 4) meta.loadout.push(k);
      saveMeta(); renderMeta();
    });
    $('mList').appendChild(b);
  });
}
$('metaBtn').addEventListener('click', () => { renderMeta(); $('metaOv').hidden = false; });
$('pull1').addEventListener('click', () => pull(1));
$('pull10').addEventListener('click', () => pull(10));
$('mBack').addEventListener('click', () => { LK = meta.loadout.filter(k => meta.owned[k]); $('metaOv').hidden = true; buildShop(); refreshAll(); renderMeta(); });
renderMeta();
buildShop();
reset('normal');
try {
  const q = new URLSearchParams(location.search).get('room');
  if (q && /^[A-Za-z0-9]{5}$/.test(q)) { $('codeIn').value = q.toUpperCase(); menuMsg(`偵測到房間 ${q.toUpperCase()}，連線中…`); setTimeout(() => joinRoom(q), 400); }
} catch (e) {}
requestAnimationFrame(frame);
})();
</script>
